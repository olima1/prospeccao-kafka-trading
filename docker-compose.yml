# Infraestrutura da PoC: um broker Apache Kafka em modo KRaft (sem ZooKeeper)
# e, opcionalmente, uma interface web para ver tópicos, partições, grupos e lag.
#
#   docker compose up -d                 -> sobe só o Kafka (localhost:9092)
#   docker compose --profile ui up -d    -> Kafka + Kafka UI (http://localhost:8080)
#   docker compose down                  -> derruba tudo e APAGA os eventos gravados
#
# Configuração baseada no exemplo oficial "single-node/plaintext" da imagem apache/kafka.
services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: kafka-poc
    ports:
      - "9092:9092"   # porta usada pelos scripts Python
    environment:
      # Um único nó fazendo os dois papéis do KRaft: broker (dados) e controller (metadados).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      # Dois "endereços": PLAINTEXT_HOST para a sua máquina (localhost:9092) e
      # PLAINTEXT para outros containers da rede do compose (kafka:19092, usado pelo Kafka UI).
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Só existe 1 broker, então os tópicos internos não podem ter réplicas.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # Rebalanceia o consumer group na hora (o padrão espera 3 s).
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Onde o broker grava o log (dentro do container; "docker compose down" apaga).
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # Padrões da PoC: tópicos nascem com 3 partições e os eventos ficam guardados por 24 h.
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui-poc
    profiles: ["ui"]   # só sobe com:  docker compose --profile ui up -d
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: poc-trading
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka
